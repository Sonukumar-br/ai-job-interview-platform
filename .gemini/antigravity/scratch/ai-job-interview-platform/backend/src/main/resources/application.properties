# Server Configuration (Supports cloud platform PORT injection)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=interview-platform-backend

# Production & Development Database Configuration (MySQL / MariaDB)
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/ai_job_prep?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Production Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Allowed Origins (Supports FRONTEND_URL environment variable)
app.cors.allowed-origins=${FRONTEND_URL:${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}}

# JWT Configuration (Minimum 256-bit Secret Key for HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Engine Configuration (Google Gemini LLM API)
app.ai.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
app.ai.model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Multipart File Upload Limits (5MB Max for PDF Resumes)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
